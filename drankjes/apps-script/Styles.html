<style>
:root {
  --paper: #f3eee6;
  --card: #fbf8f2;
  --ink: #221e1a;
  --muted: #5c534c;
  --line: #e4d9c8;
  --green: #1e6a45;
  --green-soft: #e7f3ec;
  --amber: #8a5a12;
  --amber-soft: #f8efd8;
  --red: #9d3a32;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Outfit", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  background:
    radial-gradient(900px 420px at 0% -10%, #fffaf3 0%, transparent 55%),
    var(--paper);
}

.top, .summary, .layout, footer {
  width: min(1080px, calc(100% - 32px));
  margin-left: auto;
  margin-right: auto;
}

.top { padding-top: 40px; }

.eyebrow {
  margin: 0 0 8px;
  color: var(--green);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

h1, h2, .summary, .sugar strong, .score strong, .rank {
  font-family: var(--serif);
  font-weight: 600;
  letter-spacing: -0.03em;
}

h1 {
  margin: 0;
  font-size: clamp(36px, 5vw, 58px);
  line-height: 1.02;
}

.lede {
  max-width: 40rem;
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 18px;
}

.summary {
  margin: 28px auto 8px;
  font-size: clamp(22px, 3vw, 28px);
  line-height: 1.3;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 28px;
  align-items: start;
  margin-top: 22px;
}

.board-head { margin-bottom: 14px; }

.board-head h2, .composer h2, .sheet h2 {
  margin: 0;
  font-size: 28px;
}

.board-note, .form-help, .sheet p, footer p { color: var(--muted); }

.board-note { margin: 4px 0 0; }

.drinks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}

.drink {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px 16px;
  padding: 16px 16px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
}

.drink.band-lichter { box-shadow: inset 3px 0 0 var(--green); }
.drink.band-gemiddeld { box-shadow: inset 3px 0 0 #c4841d; }
.drink.band-zwaar { box-shadow: inset 3px 0 0 var(--red); }

.rank {
  margin: 2px 0 0;
  min-width: 1.4ch;
  color: #8a7d6e;
  font-size: 28px;
  line-height: 1;
}

.drink.is-first .rank { color: var(--green); }

.kicker {
  margin: 0 0 2px;
  color: var(--green);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.drink.band-gemiddeld .kicker { color: var(--amber); }
.drink.band-zwaar .kicker { color: var(--red); }

.title-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
}

.drink h3 {
  margin: 0;
  font-family: var(--sans);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.sugar, .score { margin: 0; text-align: right; white-space: nowrap; }

.sugar strong, .score strong { display: block; font-size: 32px; line-height: 0.95; }

.sugar span, .score span { color: var(--muted); font-size: 12px; font-weight: 500; }

.versus, .note, .meta { margin: 8px 0 0; }

.versus { font-size: 14px; }

.note, .ingredients { color: var(--muted); }

.ingredients {
  font-size: 13px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.meter {
  height: 8px;
  margin-top: 12px;
  background: #e7e0d4;
  border-radius: 99px;
  overflow: hidden;
}

.meter span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--green);
}

.band-gemiddeld .meter span { background: #c4841d; }
.band-zwaar .meter span { background: var(--red); }

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  color: var(--muted);
  font-size: 14px;
}

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

button, .button {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 999px;
  text-decoration: none;
}

button { color: inherit; }

.actions button, .sheet-actions button, #cancel {
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--line);
}

button[type="submit"], button.primary, .button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 18px;
  background: var(--ink);
  color: var(--card);
  border: 0;
}

button:hover, .button:hover { border-color: var(--ink); }
button[type="submit"]:hover, button.primary:hover, .button:hover { background: var(--green); }

button:focus-visible, .button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

button:disabled { opacity: 0.55; cursor: wait; }

.confirm { margin: 12px 0 0; font-size: 14px; }

.danger {
  background: var(--red) !important;
  color: white !important;
  border-color: var(--red) !important;
}

.composer { position: sticky; top: 16px; display: grid; gap: 14px; }

form, .sheet {
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
}

.form-help { margin: 8px 0 16px; font-size: 14px; }

label {
  display: grid;
  gap: 6px;
  margin-bottom: 12px;
  font-size: 13px;
  font-weight: 600;
}

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

input::placeholder, textarea::placeholder { color: #a89886; }

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d9cebf;
  border-radius: 12px;
  background: white;
  color: inherit;
  font: inherit;
  font-size: 16px;
  font-weight: 400;
}

textarea { resize: vertical; min-height: 88px; }

.hits { display: grid; gap: 8px; margin: 12px 0; }

.hit {
  display: grid;
  gap: 2px;
  width: 100%;
  padding: 10px 12px;
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: inherit;
}

.hit strong { font-size: 14px; }

.hit span { color: var(--muted); font-size: 12px; font-weight: 500; }

.hit.is-selected { border-color: var(--green); background: var(--green-soft); }

.preview { min-height: 1.2em; margin: 0 0 12px; color: var(--green); font-size: 14px; }

.form-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.form-error { margin: 12px 0 0; color: var(--red); font-size: 14px; }

.sheet h2 { font-size: 22px; }

.sheet p { margin: 8px 0 0; font-size: 14px; }

.path, .updated { overflow-wrap: anywhere; font-size: 13px; }

.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.warnings {
  margin: 0 0 12px;
  padding: 12px 14px;
  background: var(--amber-soft);
  border: 1px solid #e3d2a4;
  border-radius: 12px;
  color: var(--ink);
  font-size: 14px;
}

.warnings p { margin: 0; }
.warnings p + p { margin-top: 6px; }

.empty {
  margin: 0;
  padding: 20px;
  border: 1px dashed var(--line);
  border-radius: 18px;
  color: var(--muted);
}

footer { padding: 28px 0 48px; }
footer p { margin: 0; font-size: 13px; }

.is-fresh { animation: flash 1.6s ease; }

@keyframes flash {
  from { background: var(--green-soft); }
  to { background: var(--card); }
}

@media (max-width: 800px) {
  .top { padding-top: 24px; }
  .layout { grid-template-columns: 1fr; }
  .composer { position: static; }
  .title-row { display: block; }
  .sugar, .score { text-align: left; margin-top: 10px; }
  .split { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .is-fresh { animation: none; background: var(--green-soft); }
}
</style>
